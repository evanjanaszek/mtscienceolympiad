<!DOCTYPE html>
<html>

<head>

<title>
Team Engagement Survey
</title>


<script src="https://cdn.auth0.com/js/auth0-spa-js/latest/auth0-spa-js.production.js"></script>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>


body{

font-family:'Poppins',sans-serif;
background:#f4f6f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;

}



.card{

background:white;
width:420px;
padding:35px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
text-align:center;

}



.logo{

width:140px;
margin-bottom:15px;

}



h2{

color:#1f3a5f;

}



button{

width:100%;
padding:13px;
margin:8px 0;
background:#1f3a5f;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
font-family:'Poppins';
cursor:pointer;

}



button:hover{

background:#162b45;

}



.hidden{

display:none;

}



.mainTitle{

font-size:18px;
color:#1f3a5f;

}



.info{

text-align:left;
line-height:1.8;
margin-top:20px;

}



.surveyIDDisplay{

font-size:30px;
font-weight:700;
color:#1f3a5f;
margin:20px;

}



.loading{

color:#1f3a5f;
font-weight:600;

}



.footerTime{

margin-top:25px;
font-size:13px;
color:#777;

}



.error{

color:red;
font-weight:bold;

}


</style>

</head>


<body>


<div class="card">


<!-- LOGIN PAGE -->


<div id="loginPage">


<img class="logo" src="https://i.imgur.com/U80EXGS.png">


<h2>

Manheim Township Science Olympiad

</h2>


<p class="mainTitle">

Team Engagement Survey

</p>


<button onclick="login()">

Login

</button>


</div>





<!-- USER PAGE -->


<div id="home" class="hidden">


<img class="logo" src="https://i.imgur.com/U80EXGS.png">


<h2>

Team Engagement Survey

</h2>


<h3 id="welcome"></h3>



<div>

Your Survey ID:

</div>


<div class="surveyIDDisplay" id="surveyID">

</div>



<div class="info">


<b>Name:</b>

<span id="name"></span>

<br>


<b>Grade:</b>

<span id="grade"></span>

<br>


<b>Building:</b>

<span id="building"></span>


</div>




<button onclick="takeSurvey()">

Take Survey

</button>



<button onclick="logout()">

Logout

</button>


</div>




<div id="errorMessage" class="error"></div>


<div id="currentTime" class="footerTime"></div>



</div>




<script>


// =====================================
// AUTH0 SETTINGS
// =====================================


const AUTH0_DOMAIN = 
"mtscienceolympiad.us.auth0.com";


const AUTH0_CLIENT_ID =
"hXhgBXIi9VbPGeJQ968X3EO31SWPfly1";



const QUALTRICS_LINK =
"https://mtwp.net";




// =====================================
// VARIABLES
// =====================================


let auth0Client;





// =====================================
// START
// =====================================


async function startApp(){


try{


auth0Client = await createAuth0Client({


domain: AUTH0_DOMAIN,


clientId: AUTH0_CLIENT_ID,


authorizationParams:{


redirect_uri: window.location.href


}


});





if(window.location.search.includes("code=")){


await auth0Client.handleRedirectCallback();


window.history.replaceState(
{},
document.title,
"/"
);


}




let loggedIn = await auth0Client.isAuthenticated();




if(loggedIn){


loadUser();


}

else{


document.getElementById("loginPage").className="";


}



}

catch(error){


document.getElementById("errorMessage").innerHTML =

"Error loading Auth0: " + error.message;


}


}





// =====================================
// LOGIN
// =====================================


async function login(){


await auth0Client.loginWithRedirect();


}





// =====================================
// LOAD USER
// =====================================


async function loadUser(){


let user = await auth0Client.getUser();




document.getElementById("loginPage").className="hidden";


document.getElementById("home").className="";




document.getElementById("welcome").innerHTML =

"Welcome!";




document.getElementById("surveyID").innerHTML =

user[
"https://evanjanaszek.github.io/mtscienceolympiad/surveyID"
]
||
"No Survey ID Found";




document.getElementById("name").innerHTML =

user.name || "";




document.getElementById("grade").innerHTML =

user[
"https://evanjanaszek.github.io/mtscienceolympiad/grade"
]
||
"";




document.getElementById("building").innerHTML =

user[
"https://evanjanaszek.github.io/mtscienceolympiad/building"
]
||
"";



}





// =====================================
// SURVEY BUTTON
// =====================================


function takeSurvey(){


window.open(

QUALTRICS_LINK,

"_blank"

);


}





// =====================================
// LOGOUT
// =====================================


async function logout(){


await auth0Client.logout({

logoutParams:{

returnTo:window.location.href

}

});


}





// =====================================
// CLOCK
// =====================================


function updateTime(){


let now = new Date();


document.getElementById("currentTime").innerHTML =

"Current Time: " +

now.toLocaleString("en-US",{

timeZone:"America/New_York",

month:"numeric",

day:"numeric",

year:"numeric",

hour:"numeric",

minute:"2-digit",

second:"2-digit"

});


}



setInterval(updateTime,1000);

updateTime();




startApp();


</script>


</body>

</html>
