<!DOCTYPE html>
<html>

<head>

<title>
Team Engagement Survey Portal
</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<script src="https://cdn.auth0.com/js/auth0-spa-js/latest/auth0-spa-js.production.js"></script>


<style>

body{

font-family:'Poppins',sans-serif;
background:#f4f6f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;

}



.card{

background:white;
width:420px;
padding:35px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
text-align:center;

}



.logo{

width:140px;
margin-bottom:15px;

}



.loadingLogo{

width:220px;
margin-bottom:20px;

}



h2{

color:#1f3a5f;

}



button{

width:100%;
padding:13px;
margin:8px 0;
background:#1f3a5f;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
font-family:'Poppins';
cursor:pointer;

}



button:hover{

background:#162b45;

}



.hidden{

display:none;

}



.loading{

color:#1f3a5f;
font-weight:600;

}



.loadingTitle{

font-size:24px;
font-weight:600;

}



.loadingText{

font-size:16px;
color:#555;

}



.mainTitle{

font-size:18px;
color:#1f3a5f;
margin-top:-10px;

}



.info{

text-align:left;
line-height:1.8;
margin-top:20px;

}



.surveyIDDisplay{

font-size:30px;
font-weight:700;
color:#1f3a5f;
margin:20px 0;

}



.statusActive{

color:green;
font-weight:700;

}



.statusClosed{

color:red;
font-weight:700;

}



.statusBefore{

color:#1f3a5f;
font-weight:700;

}



.statusConstruction{

color:#1f3a5f;
font-weight:700;

}



.statusUnavailable{

color:#555;
font-weight:700;

}



.footerTime{

margin-top:25px;
font-size:13px;
color:#777;

}


</style>

</head>


<body>


<div class="card">


<!-- LOADING -->

<div id="loadingPage">


<img class="loadingLogo" src="https://i.imgur.com/U80EXGS.png">


<h2 class="loadingTitle">

Team Engagement Survey

</h2>


<p class="loadingText">

Loading...

</p>


</div>





<!-- LOGIN PAGE -->


<div id="loginPage" class="hidden">


<img class="logo" src="https://i.imgur.com/U80EXGS.png">


<h2>

Manheim Township Science Olympiad

</h2>


<p class="mainTitle">

Team Engagement Survey

</p>


<div id="statusLogin"></div>


<button onclick="login()">

Login

</button>


</div>





<!-- MAIN PAGE -->


<div id="home" class="hidden">


<img class="logo" src="https://i.imgur.com/U80EXGS.png">


<h2>

Manheim Township Science Olympiad

</h2>


<p class="mainTitle">

Team Engagement Survey

</p>



<div id="surveyStatus"></div>



<h3 id="welcome"></h3>



<div class="surveyIDDisplay" id="surveyID"></div>




<div class="info">


<b>Name:</b>

<span id="name"></span>

<br>


<b>Grade:</b>

<span id="grade"></span>

<br>


<b>Building:</b>

<span id="building"></span>


</div>



<button id="surveyButton" onclick="takeSurvey()">

Take Survey

</button>



<button onclick="logout()">

Logout

</button>



</div>





<!-- STATUS ONLY PAGE -->


<div id="statusPage" class="hidden">


<img class="logo" src="https://i.imgur.com/U80EXGS.png">


<div id="statusMessage"></div>


</div>





<div id="currentTime" class="footerTime"></div>



</div>
<script>


// =================================================
// AUTH0 SETTINGS
// =================================================

const AUTH0_DOMAIN = "mtscienceolympiad.us.auth0.com";

const AUTH0_CLIENT_ID = "hXhgBXIi9VbPGeJQ968X3EO31SWPfly1";



// =================================================
// SURVEY SETTINGS
// CHANGE ONLY THIS SECTION
// =================================================


// Options:
// "Active"
// "Pre-Survey"
// "Closed"
// "Construction"
// "Unavailable"


const surveySettings = {


    status: "Active",


    openDate: "August 25, 2026",


    closeDate: "September 15, 2026"


};



// =================================================
// VARIABLES
// =================================================


let auth0Client;



// =================================================
// START APP
// =================================================


async function startApp(){



auth0Client = await createAuth0Client({


domain: AUTH0_DOMAIN,


clientId: AUTH0_CLIENT_ID,


authorizationParams:{


redirect_uri: window.location.href


}


});





if(window.location.search.includes("code=")){



await auth0Client.handleRedirectCallback();


window.history.replaceState({}, document.title, "/");



}




let loggedIn = await auth0Client.isAuthenticated();




document.getElementById("loadingPage").className="hidden";




if(loggedIn){



loadUser();



}


else{



document.getElementById("loginPage").className="";

showLoginStatus();


}




}




// =================================================
// LOGIN
// =================================================



async function login(){



await auth0Client.loginWithRedirect();



}




// =================================================
// LOAD USER
// =================================================



async function loadUser(){



let user = await auth0Client.getUser();



document.getElementById("home").className="";



document.getElementById("welcome").innerHTML =

"Welcome, " +

(user["https://mtscienceolympiad.com/firstName"] || user.name)

+ "!";




document.getElementById("surveyID").innerHTML =

user["https://mtscienceolympiad.com/surveyID"];



document.getElementById("name").innerHTML =

(user["https://mtscienceolympiad.com/firstName"] || "")

+

" "

+

(user["https://mtscienceolympiad.com/lastName"] || "");




document.getElementById("grade").innerHTML =

user["https://mtscienceolympiad.com/grade"] || "";




document.getElementById("building").innerHTML =

user["https://mtscienceolympiad.com/building"] || "";




showSurveyStatus();



}






// =================================================
// STATUS SYSTEM
// =================================================



function showSurveyStatus(){



let box = document.getElementById("surveyStatus");

let button = document.getElementById("surveyButton");



if(surveySettings.status=="Active"){



box.innerHTML =

"<p class='statusActive'>Survey is currently open.</p>" +

"<p>Survey closes on: "

+

surveySettings.closeDate

+

"</p>";



button.style.display="block";



}




else if(surveySettings.status=="Pre-Survey"){



box.innerHTML =

"<p class='statusBefore'>The survey is not yet active.</p>" +

"<p>The survey opens on: "

+

surveySettings.openDate

+

"</p>";



button.style.display="none";



}




else if(surveySettings.status=="Closed"){



box.innerHTML =

"<p class='statusClosed'>Survey Closed</p>" +

"<p>All surveys have been completed.</p>";



button.style.display="none";



}




else if(surveySettings.status=="Construction"){



box.innerHTML =

"<p class='statusConstruction'>🚧</p>" +

"<p class='statusConstruction'>This site is currently under construction.</p>";



button.style.display="none";



}




else if(surveySettings.status=="Unavailable"){



box.innerHTML =

"<p class='statusUnavailable'>⚠️</p>" +

"<p class='statusUnavailable'>This survey page is currently unavailable.</p>";



button.style.display="none";



}




}






function showLoginStatus(){



let box=document.getElementById("statusLogin");



if(surveySettings.status=="Pre-Survey"){



box.innerHTML=

"<p class='statusBefore'>Survey opens on: "

+

surveySettings.openDate

+

"</p>";



}



else if(surveySettings.status=="Closed"){



box.innerHTML=

"<p class='statusClosed'>Survey Closed</p>";



}



else if(surveySettings.status=="Construction"){



box.innerHTML=

"<p class='statusConstruction'>Site Under Construction</p>";



}



else if(surveySettings.status=="Unavailable"){



box.innerHTML=

"<p class='statusUnavailable'>Unavailable</p>";



}



}





  // =================================================
// TAKE SURVEY
// =================================================


function takeSurvey(){


let id = document.getElementById("surveyID").innerHTML;



window.open(

"YOUR_QUALTRICS_LINK?SurveyID=" + id,

"_blank"

);



}






// =================================================
// LOGOUT
// =================================================


async function logout(){



await auth0Client.logout({


logoutParams:{


returnTo: window.location.href


}


});



}






// =================================================
// CLOCK
// =================================================


function updateTime(){


let now = new Date();



document.getElementById("currentTime").innerHTML =

"Current Time: " +

now.toLocaleString("en-US",{


timeZone:"America/New_York",


month:"numeric",


day:"numeric",


year:"numeric",


hour:"numeric",


minute:"2-digit",


second:"2-digit"


});



}



updateTime();

setInterval(updateTime,1000);






// =================================================
// START
// =================================================


startApp();



</script>


</body>


</html>
